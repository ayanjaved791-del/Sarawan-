<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        function isWsError(err) {
          var str = '';
          try {
            str = String((err && (err.message || err.reason || err.stack || err)) || '');
          } catch (e) {}
          return /websocket|ws:/i.test(str) || str.indexOf('closed without opened') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isWsError(event.error || event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
